# Hearth — local personal agent configuration
agent:
  name: "Hearth"
  # Where the agent keeps the files it creates for you
  workspace: "~/hearth/workspace"
  # Internal data (memory database, job logs)
  data_dir: "~/.hearth"

# Which inference engine drives the agent:
#   ollama   — easy default, OpenAI-compatible server (keep this unless experimenting)
#   llamacpp — direct llama.cpp via llama-cpp-python. Unlocks the full GGUF
#              quant zoo (IQ1_M, TQ1_0, …), KV-cache quantization, and Metal
#              GPU layers. This is the engine for the 70B quest.
#   mlx      — Apple-Silicon-native via mlx-lm (macOS only, untested-on-Mac
#              prototype). Best ~2-bit story on the M1 Pro (oQ/JANG MoE
#              quants); the likely eventual engine for the 70B quest.
backend: "ollama"

# Model cascade (opt-in): set backend: "cascade" to keep a small fast model
# resident and escalate hard queries to a big model. The big model is loaded
# LAZILY on the first escalation, so its RAM cost only appears when needed —
# the 70B-quest pattern (e.g. small qwen3:8b, big 35B-A3B IQ2_M via llamacpp).
# router: "heuristic" (complexity rule on the last user message) or "verify"
# (try small first, escalate on refusal / empty reply). "heuristic" is one
# pass; "verify" costs two passes on escalated queries.
#cascade:
#  router: "heuristic"          # or "verify"
#  heuristic_len_chars: 2000   # escalate if the last user message is longer
#  heuristic_keyword_hits: 2   # ...or hits this many complexity keywords
#  # small: defaults to the ollama block above; override to use llamacpp:
#  # small: {backend: ollama, ollama: {host: http://localhost:11434, model: qwen3:4b}}
#  big:
#    backend: ollama
#    ollama: {host: http://localhost:11434, model: qwen35-35b-a3b-full}

ollama:
  host: "http://localhost:11434"
  # Pick a model that fits comfortably in 16 GB unified memory.
  #   qwen3:8b            ~5.2 GB  — best all-round pick, good tool use
  #   qwen35-35b-a3b-full ~11 GB   — validated rung 3 (2026-09-21): the
  #                                  smartest model that fits; ~28 tok/s
  #   llama3.1:8b         ~4.9 GB  — solid alternative
  #   qwen3:4b            ~2.6 GB  — if you need RAM headroom for heavy apps
  model: "qwen3:8b"
  temperature: 0.6
  # Context window. 16384 is a safe default; raise to 32768 if you
  # mostly chat while other apps are closed.
  num_ctx: 16384

llamacpp:
  # Path to a GGUF file. Example for the 70B quest (experimental):
  #   model_path: "~/.hearth/models/llama3.3-70b-IQ1_M.gguf"
  model_path: "~/.hearth/models/model.gguf"
  num_ctx: 8192
  # -1 = offload all layers to GPU/Metal. Free on unified-memory Macs
  # (GPU and CPU share the same 16 GB); use 0 on machines without a GPU.
  n_gpu_layers: -1
  n_threads: 0            # 0 = auto
  # KV-cache quantization: f16 | q8_0 | q4_0. A smaller cache leaves more
  # room for weights — q8_0 is the safe pick.
  cache_type_k: "q8_0"
  cache_type_v: "q8_0"
  temperature: 0.6

mlx:
  # HuggingFace repo id or local model directory, e.g. an mlx-community
  # quantized model. Example for the 70B quest (experimental, untested):
  #   model: "<your HF repo id, e.g. an oQ/JANG 35B-A3B MLX quant>"
  model: "mlx-community/Mistral-7B-Instruct-v0.3-4bit"
  temperature: 0.6
  top_p: 1.0
  max_tokens: 1024       # per reply; the agent loops, so keep this generous
  repetition_penalty: 1.0
  # seed: 42            # optional, for reproducible runs
  # adapter_path: "~/.hearth/adapters/lora"  # optional LoRA adapter

# OpenAI-compatible HTTP servers (untested-on-Mac transport): set
# backend: "openai" and point at `vmlx serve` (the rung-4 oQ2-smelt
# recipe) or `mlx_lm.server` (the MLX tool-calling transport follow-up).
# openai:
#   base_url: "http://localhost:8000"  # vmlx serve default port
#   model: "Jundot/Qwen3.6-35B-A3B-oQ2"
#   temperature: 0.6
#   # max_tokens: 1024    # optional per-reply cap
#   # api_key: ...        # optional; or set OPENAI_API_KEY in the env
# Also usable as a cascade big model:
# cascade:
#   big:
#     backend: openai
#     openai: {base_url: "http://localhost:8000", model: "Jundot/Qwen3.6-35B-A3B-oQ2"}

memory:
  total_ram_gb: 16   # machine RAM
  reserved_gb: 5     # keep for macOS + other apps; the rest is the model budget
                     # (used by the estimate_fit tool)

limits:
  shell_timeout: 60        # seconds per shell command
  max_tool_rounds: 12      # max tool-call rounds per reply
  max_tool_output: 6000    # chars of tool output fed back to the model
