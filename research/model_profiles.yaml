# Candidate model profiles for the 70B quest
# status: stable | experimental | watch | unavailable
# est_gb: estimated weight size on disk/in RAM (excludes KV cache + OS)

profiles:
  - name: qwen3:8b
    params_b: 8
    quant: Q4_K_M
    est_gb: 5.2
    backend: ollama
    status: stable
    notes: Current Hearth default. The baseline everything else must beat.
      Rung-1 ladder candidate (20 tok/s target); recipe at
      research/recipes/RUNG1_qwen3_8b_20tps.md.

  - name: qwen3:14b
    params_b: 14
    quant: Q4_K_M
    est_gb: 9.0
    backend: ollama
    status: experimental
    notes: >
      Rung-2 ladder candidate (14B-class at 20 tok/s). 14.7B params at
      4.9 bpw = 9.0 GB weights (fitcheck arch qwen3-14b); ~9.8 GB total
      @ 2048 ctx f16. Decode roofline on M1 Pro (~200 GB/s) ≈ 22 tok/s —
      TIGHT against the 20 tok/s bar, expect tuning (num_ctx, KV cache
      type) to be needed. Recipe at
      research/recipes/RUNG2_qwen3_14b_20tps.md; measure with
      tools/measure_rung.py.

  - name: qwen3.5-35b-a3b-iq2_xxs
    params_b: 34.65
    quant: UD-IQ2_XXS
    est_gb: 10.66
    backend: ollama
    status: experimental
    notes: >
      Rung-3 ladder candidate (35B-class MoE at usable speed). Measured file
      size 10.66 GB (HF tree API 2026-09-21 — the morning survey's 10.6 GB
      figure was misattributed; IQ2_M re-measures at 11.39 GB and does not
      fit). ~11.3 GB total @ 2048 ctx + q8_0 KV (fitcheck arch
      qwen3.5-35b-a3b: 40 layers, GQA-2, head_dim 256) — the tightest rung
      on RAM; needs a lean macOS. Decode cost set by ACTIVE params
      (~3.3B/token), not total; pass bar >= 15 tok/s (usable), stretch 20+.
      Quality at ~2.46 eff. bpw is the key unknown. Recipe at
      research/recipes/RUNG3_qwen3_5_35b_a3b_moe.md; measure with
      tools/measure_rung.py --target 15. Fallback: UD-IQ2_M (11.39 GB,
      ~12 GB resident) if XXS quality disappoints and RAM allows; MTP
      variant + llamacpp speculative prompt_lookup per the recipe.

  - name: llama3.3-70b-IQ1_M
    params_b: 70
    quant: IQ1_M
    est_gb: 15.3
    backend: ollama
    status: experimental
    notes: >
      ~1.75 bpw GGUF. Likely OOM on 16GB once macOS (~4-6GB) + KV cache are
      counted, but worth measuring. Needs importance-matrix quant for best
      quality. Check HF for available files and Ollama TQ/IQ1 support.

  - name: llama3.3-70b-TQ1_0
    params_b: 70
    quant: TQ1_0
    est_gb: 14.9
    backend: ollama
    status: watch
    notes: >
      Ternary quant (~1.69 bpw) in llama.cpp. Even tighter fit than IQ1_M.
      Blocked on: Ollama shipping a llama.cpp build with TQ support, and
      community 70B TQ1_0 GGUFs existing.

  - name: bitnet-70b-1.58bit
    params_b: 70
    quant: ternary-1.58bit
    est_gb: 13.8
    backend: bitnet.cpp
    status: unavailable
    notes: >
      The endgame: 70B trained from scratch in ternary. No well-trained
      public weights exist yet (public max ~8-10B, low token counts).
      Watch microsoft/BitNet and bitnet.cpp releases.

  - name: qwen3.6-35b-a3b-oQ2
    params_b: 35
    quant: oQ-mixed-2bit
    est_gb: 13.1
    backend: mlx
    status: experimental
    notes: >
      Prebuilt oQ2 MLX quant of Qwen3.6-35B-A3B (oMLX v0.3.7, 2-bit,
      group 64, MLX safetensors). 13.10 GB MEASURED 2026-09-21 via the
      HF tree API (repo Jundot/Qwen3.6-35B-A3B-oQ2, uploaded 2026-04-23;
      corrects the stale 8.8 GB estimate). Over the ~11 GB usable budget
      fully resident. The 2026-09-21 rung-4 plan (vmlx --smelt 50) is
      INVALID — code-verified 2026-09-22: Smelt requires JANG-format
      models and vmlx ships no oQ loader. Best-benchmarked ~2-bit
      quality: 64% MMLU vs 14% naive (oMLX docs; measured on the 3.5
      variant — the 3.6 variant is unmeasured). On the watch list: if
      vmlx ever ships an oQ loader, or JANGQ-AI ships a JANG-format 3.6
      at ~2-bit, it becomes a rung-4 candidate again. Hearth's `mlx`
      backend cannot load the oQ2 affine format.

  - name: qwen3.5-35b-a3b-JANG_2S
    params_b: 35
    quant: JANG-mixed-2bit
    est_gb: 11.65
    backend: openai
    status: experimental
    notes: >
      Prebuilt JANG 2-bit MLX quant of Qwen3.5-35B-A3B
      (repo JANGQ-AI/Qwen3.5-35B-A3B-JANG_2S). 11.65 GB MEASURED
      2026-09-22 via safetensors-header probe (10.75 GB text + 0.89 GB
      vision; mixed 2/4/6-bit, 2.17 bpw actual per jang_config.json).
      Card claims 65.5% MMLU (200-question subset, author-reported) vs
      ~20% naive MLX 2-bit. JANG profile confirmed in vmlx source
      (HYBRID_JANG_PROFILES) — Smelt-eligible: smelt-50 -> ~7.8 GB
      resident, smelt-25 -> ~5.8 GB (fitcheck, text-only). Rung-4 ladder
      candidate: recipe at research/recipes/RUNG4_jang2s_35b_smelt.md.
      Served by vmlx (or MLX Studio Server mode) over OpenAI-compatible
      HTTP; Hearth drives it via `backend: openai`.

  - name: qwen3.6-35b-a3b-exl3-2bpw
    params_b: 35
    quant: EXL3-2.08bpw
    est_gb: 11.6
    backend: exl3
    status: watch
    notes: >
      Prebuilt EXL3 quant of Qwen3.6-35B-A3B (repo
      yeasah/Qwen3.6-35B-A3B-exl3, published 2026-09-21; per-bitrate
      weights live as git revisions, invisible on main). Author-reported
      figures (NOT independently measured): qbench (openwebtext10k, 10 x
      2048-token rows) 2.00bpw-H5 ppl 10.865 / KLD 0.1136 vs bf16 10.097
      (+7.6%) at 2.13 bpw_layer; 3.00bpw-H5 +1.1% / KLD 0.0302; 6.00bpw
      ppl-identical to bf16. README claims 2.08 bpw = 10.83 GiB disk
      (tree API measures 11.72 GB across 2 shards) / 9.88 GiB VRAM under
      exllamav3 with embeddings CPU-offloaded — INSIDE the 10-11 GB
      usable budget fully resident. Sibling Ornith-1.5-35B-A3B-exl3
      confirms the curve on a second 35B-A3B MoE (2.00bpw-H5 ppl 12.336
      vs bf16 11.431, +7.9%, KLD 0.1775, 9.6 GB VRAM). This is the best
      ~2-bpw 35B-A3B fidelity datapoint on record (+7.6% ppl vs JANG_2S's
      author-claimed 65.5% MMLU and oQ2's measured 64% MMLU on the 3.5
      variant). BLOCKED on Mac transport: mlxl3 (the only Apple-Silicon
      EXL3 engine, v1.1.1 — Qwen3.6-35B-A3B EXL3 2.49bpw TESTED on M5 at
      47.545 tok/s median decode, DFlash2 speculative 74.645 tok/s) ships
      NO HTTP/OpenAI server surface (Desktop chat + `mlxl3 run` CLI
      only; README re-checked 2026-09-22 — transport gap stands), and
      the exllamav3 / vLLM engines are CUDA-only. M1 Pro perf is
      unmeasured (M5-only campaign); mlxl3 release build requires macOS
      26.2+. Comparison caveat: 3.6 base vs rung-3's 3.5 base, so not
      same-base — a Qwen3.5-35B-A3B 2bpw EXL3 upload would enable the
      apples-to-apples comparison vs IQ2_XXS. Hearth drives the battery
      over the mlxl3 one-shot CLI bridge
      (tools/eval_battery_openai.py --transport mlxl3, untested-on-Mac;
      agent.py wiring contingent on Mac-side stdout-parse validation).
      Recipe: research/recipes/RUNG4_exl3_mlxl3.md.

  - name: qwen3-30b-a3b-Q3_K_M
    params_b: 30
    quant: Q3_K_M
    est_gb: 13.0
    backend: ollama
    status: experimental
    notes: >
      30B MoE GGUF fallback if MLX backend isn't ready. Tight but plausible.
      Quality at Q3 needs verification for tool-calling reliability.
