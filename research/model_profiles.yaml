# Candidate model profiles for the 70B quest
# status: stable | experimental | watch | unavailable
# est_gb: estimated weight size on disk/in RAM (excludes KV cache + OS)

profiles:
  - name: qwen3:8b
    params_b: 8
    quant: Q4_K_M
    est_gb: 5.2
    backend: ollama
    status: stable
    notes: Current Hearth default. The baseline everything else must beat.
      Rung-1 ladder candidate (20 tok/s target); recipe at
      research/recipes/RUNG1_qwen3_8b_20tps.md.

  - name: qwen3:14b
    params_b: 14
    quant: Q4_K_M
    est_gb: 9.0
    backend: ollama
    status: experimental
    notes: >
      Rung-2 ladder candidate (14B-class at 20 tok/s). 14.7B params at
      4.9 bpw = 9.0 GB weights (fitcheck arch qwen3-14b); ~9.8 GB total
      @ 2048 ctx f16. Decode roofline on M1 Pro (~200 GB/s) ≈ 22 tok/s —
      TIGHT against the 20 tok/s bar, expect tuning (num_ctx, KV cache
      type) to be needed. Recipe at
      research/recipes/RUNG2_qwen3_14b_20tps.md; measure with
      tools/measure_rung.py.

  - name: qwen3.5-35b-a3b-iq2_xxs
    params_b: 34.65
    quant: UD-IQ2_XXS
    est_gb: 10.66
    backend: ollama
    status: experimental
    notes: >
      Rung-3 ladder candidate (35B-class MoE at usable speed). Measured file
      size 10.66 GB (HF tree API 2026-09-21 — the morning survey's 10.6 GB
      figure was misattributed; IQ2_M re-measures at 11.39 GB and does not
      fit). ~11.3 GB total @ 2048 ctx + q8_0 KV (fitcheck arch
      qwen3.5-35b-a3b: 40 layers, GQA-2, head_dim 256) — the tightest rung
      on RAM; needs a lean macOS. Decode cost set by ACTIVE params
      (~3.3B/token), not total; pass bar >= 15 tok/s (usable), stretch 20+.
      Quality at ~2.46 eff. bpw is the key unknown. Recipe at
      research/recipes/RUNG3_qwen3_5_35b_a3b_moe.md; measure with
      tools/measure_rung.py --target 15. Fallback: UD-IQ2_M (11.39 GB,
      ~12 GB resident) if XXS quality disappoints and RAM allows; MTP
      variant + llamacpp speculative prompt_lookup per the recipe.

  - name: llama3.3-70b-IQ1_M
    params_b: 70
    quant: IQ1_M
    est_gb: 15.3
    backend: ollama
    status: experimental
    notes: >
      ~1.75 bpw GGUF. Likely OOM on 16GB once macOS (~4-6GB) + KV cache are
      counted, but worth measuring. Needs importance-matrix quant for best
      quality. Check HF for available files and Ollama TQ/IQ1 support.

  - name: llama3.3-70b-TQ1_0
    params_b: 70
    quant: TQ1_0
    est_gb: 14.9
    backend: ollama
    status: watch
    notes: >
      Ternary quant (~1.69 bpw) in llama.cpp. Even tighter fit than IQ1_M.
      Blocked on: Ollama shipping a llama.cpp build with TQ support, and
      community 70B TQ1_0 GGUFs existing.

  - name: bitnet-70b-1.58bit
    params_b: 70
    quant: ternary-1.58bit
    est_gb: 13.8
    backend: bitnet.cpp
    status: unavailable
    notes: >
      The endgame: 70B trained from scratch in ternary. No well-trained
      public weights exist yet (public max ~8-10B, low token counts).
      Watch microsoft/BitNet and bitnet.cpp releases.

  - name: qwen3.5-35b-a3b-oQ-2bit
    params_b: 35
    quant: oQ-mixed-2bit
    est_gb: 8.8
    backend: mlx
    status: experimental
    notes: >
      35B MoE, 3B active. Data-driven mixed precision: 64% MMLU at 2-bit vs
      14% naive. Fits comfortably. Requires the future MLX backend.

  - name: qwen3-30b-a3b-Q3_K_M
    params_b: 30
    quant: Q3_K_M
    est_gb: 13.0
    backend: ollama
    status: experimental
    notes: >
      30B MoE GGUF fallback if MLX backend isn't ready. Tight but plausible.
      Quality at Q3 needs verification for tool-calling reliability.
